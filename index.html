<meta name="description" content="TakTek designs, builds and runs websites, apps and custom software, and makes Devlo, the Arabic-first CMS for newsrooms. Working in English, Arabic and Turkish.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://taktek-dev.github.io/taktek-prototype/">
<link rel="alternate" hreflang="en" href="https://taktek-dev.github.io/taktek-prototype/en/"><link rel="alternate" hreflang="ar" href="https://taktek-dev.github.io/taktek-prototype/ar/"><link rel="alternate" hreflang="tr" href="https://taktek-dev.github.io/taktek-prototype/tr/"><link rel="alternate" hreflang="x-default" href="https://taktek-dev.github.io/taktek-prototype/">
<link rel="icon" href="assets/img/brand/taktek-favicon.svg" type="image/svg+xml">
<script>
(function () {
  var langs = ["en", "ar", "tr"], pick = null;
  try { pick = localStorage.getItem('tt-lang'); } catch (e) {}
  if (langs.indexOf(pick) < 0) {
    var nav = (navigator.languages || [navigator.language || '']);
    for (var i = 0; i < nav.length && !pick; i++) {
      var code = String(nav[i]).slice(0, 2).toLowerCase();
      if (langs.indexOf(code) > -1) pick = code;
    }
  }
  var old = { services: 'services/', works: 'work/', contact: 'contact/', devlo: 'devlo/', process: '#proc-h', portal: '#proc-h', faq: '#faq-h' }, hash = location.hash.slice(1);
  location.replace((pick || 'en') + '/' + (old[hash] || (hash ? '#' + hash : '')));
})();
</script>
